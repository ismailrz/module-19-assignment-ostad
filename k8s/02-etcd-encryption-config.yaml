# Part 3 — Encryption at rest for etcd.
#
# This file is NOT a resource you `kubectl apply`. It configures the
# kube-apiserver itself, so it must be placed on every control-plane node.
#
# --- Setup steps (run on the control-plane node, e.g. via SSH) ---
#
# 1. Generate a random 32-byte key and base64-encode it:
#      head -c 32 /dev/urandom | base64
#
# 2. Create the directory and file, then paste the generated key below in
#    place of <BASE64_ENCODED_32_BYTE_KEY>:
#      sudo mkdir -p /etc/kubernetes/enc
#      sudo cp 02-etcd-encryption-config.yaml /etc/kubernetes/enc/encryption-config.yaml
#      sudo chmod 600 /etc/kubernetes/enc/encryption-config.yaml
#
# 3. Edit /etc/kubernetes/manifests/kube-apiserver.yaml (kubeadm-managed
#    static pod manifest) and add:
#      spec.containers[0].command:
#        - --encryption-provider-config=/etc/kubernetes/enc/encryption-config.yaml
#      spec.containers[0].volumeMounts:
#        - name: enc
#          mountPath: /etc/kubernetes/enc
#          readOnly: true
#      spec.volumes:
#        - name: enc
#          hostPath:
#            path: /etc/kubernetes/enc
#            type: DirectoryOrCreate
#
#    The kubelet detects the manifest change and restarts kube-apiserver
#    automatically (usually within ~30-60s). Watch with:
#      watch crictl ps | grep kube-apiserver
#
# 4. Confirm the API server came back healthy:
#      kubectl get --raw='/readyz'
#
# 5. Re-encrypt any Secrets that existed before this change (encryption is
#    only applied on write):
#      kubectl get secrets --all-namespaces -o json | kubectl replace -f -
#
# 6. Verify with etcdctl as described in 01-secret-test.yaml — new/rewritten
#    Secrets should now be stored as k8s:enc:aescbc:v1:key1:<ciphertext>.
apiVersion: apiserver.config.k8s.io/v1
kind: EncryptionConfiguration
resources:
  - resources:
      - secrets
    providers:
      - aescbc:
          keys:
            - name: key1
              secret: <BASE64_ENCODED_32_BYTE_KEY>
      - identity: {}
