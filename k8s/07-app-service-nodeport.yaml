# Part 8 — Expose the application via NodePort.
apiVersion: v1
kind: Service
metadata:
  name: node-express-app-svc
  namespace: default
spec:
  type: NodePort
  selector:
    app: node-express-app
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30080
      protocol: TCP

# Access from outside the cluster (open TCP 30080 in the EC2 instance's
# security group first):
#   http://<ANY_NODE_PUBLIC_IP>:30080/
#   http://<ANY_NODE_PUBLIC_IP>:30080/api
