# Part 3 — Create a Kubernetes Secret for testing.
#
# Apply with: kubectl apply -f 01-secret-test.yaml
#
# The values below are base64-encoded ("db-secret" -> ZGItc2VjcmV0", etc.)
# purely so the manifest is self-contained. base64 is NOT encryption —
# that's exactly the point of Part 3: without encryption-at-rest configured
# on the API server, this Secret is stored in etcd as plaintext-equivalent
# (trivially reversible base64), readable by anyone with etcd access.
#
# To verify BEFORE encryption at rest is enabled:
#   sudo ETCDCTL_API=3 etcdctl \
#     --endpoints=https://127.0.0.1:2379 \
#     --cacert=/etc/kubernetes/pki/etcd/ca.crt \
#     --cert=/etc/kubernetes/pki/etcd/server.crt \
#     --key=/etc/kubernetes/pki/etcd/server.key \
#     get /registry/secrets/default/test-secret | hexdump -C
#   -> you will see the plaintext values embedded in the etcd record.
#
# After enabling encryption (see 02-etcd-encryption-config.yaml), re-run the
# same etcdctl get and confirm the record is now prefixed with
# k8s:enc:aescbc:v1:key1: followed by ciphertext instead of readable text.
apiVersion: v1
kind: Secret
metadata:
  name: test-secret
  namespace: default
type: Opaque
data:
  username: ZGItc2VjcmV0        # "db-secret"
  password: UGFzc3dvcmQxMjMh    # "Password123!"
